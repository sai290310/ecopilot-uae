<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EcoPilot UAE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* EcoPilot UAE: a single committed dark look ("environmental simulation console"). Report pages use their own light print palette. */
:root {
  color-scheme: dark;
  --bg: #05080f;
  --bg-2: #0a1222;
  --panel: #0e1828;
  --panel-2: #132036;
  --line: rgba(120, 200, 235, 0.16);
  --line-strong: rgba(120, 200, 235, 0.34);
  --fg: #e6eef8;
  --fg-2: #a9b8cc;
  --fg-3: #74859c;
  --cyan: #5fd4f2;
  --ice: #bfe9fa;
  --violet: #a58cf0;
  --emerald: #3fd39a;
  --amber: #f2b752;
  --red: #ff7b72;
  --focus: #9ff3ff;
  --r: 10px;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --display: "Chakra Petch", "IBM Plex Sans", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: auto; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(95, 212, 242, 0.08), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(165, 140, 240, 0.07), transparent 60%),
    var(--bg);
  background-image: radial-gradient(rgba(120, 200, 235, 0.06) 1px, transparent 1px), radial-gradient(900px 500px at -10% 10%, rgba(165, 140, 240, 0.07), transparent 60%);
  background-size: 22px 22px, auto;
  color: var(--fg);
  font: 14px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow-x: hidden;
}
#root { min-width: 0; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
h1 { font: 600 clamp(22px, 3vw, 30px)/1.2 var(--display); letter-spacing: 0.01em; }
h2 { font: 600 17px/1.3 var(--display); letter-spacing: 0.02em; }
h3.sub { font: 600 12px/1.3 var(--sans); color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.08em; margin: 16px 0 8px; }
p { margin: 0 0 8px; }
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--fg-2); }
.small { font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.break { word-break: break-all; }
.eyebrow { font: 600 11px/1.2 var(--mono); color: var(--cyan); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 6px; }
.lede { color: var(--fg-2); max-width: 70ch; margin-top: 8px; }
.hint { color: var(--fg-3); font-size: 12px; margin: 6px 0 0; }
.err { color: var(--red); font-size: 12.5px; margin: 6px 0 0; }
.ok-line { color: var(--emerald); }
.warn-t { color: var(--amber); }
.notice { background: rgba(242, 183, 82, 0.08); border: 1px solid rgba(242, 183, 82, 0.35); border-radius: 8px; padding: 10px 12px; color: var(--fg); margin: 10px 0; }
.notice-bad { background: rgba(255, 123, 114, 0.08); border-color: rgba(255, 123, 114, 0.4); }
.notice a, .notice button.link { font-weight: 600; }
.link { background: none; border: 0; padding: 0; color: var(--cyan); font: inherit; cursor: pointer; text-decoration: underline; }

/* shell */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 0; border-bottom: 1px solid var(--line);
  background: rgba(5, 8, 15, 0.86); backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--fg); }
.brand:hover { text-decoration: none; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: conic-gradient(from 200deg, var(--cyan), var(--emerald), var(--violet), var(--cyan)); box-shadow: 0 0 18px rgba(95, 212, 242, 0.35); }
.brand-n { display: block; font: 600 15px/1.1 var(--display); letter-spacing: 0.04em; }
.brand-s { display: block; font-size: 11px; color: var(--fg-3); }
.nav { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { display: block; padding: 7px 11px; border-radius: 8px; color: var(--fg-2); border: 1px solid transparent; transition: background 0.2s, color 0.2s, border-color 0.2s; }
.nav a:hover { color: var(--fg); background: rgba(120, 200, 235, 0.08); text-decoration: none; }
.nav a.on { color: var(--ice); background: rgba(95, 212, 242, 0.12); border-color: var(--line-strong); }
.topbar-r { margin-left: auto; }
.chip { font: 500 12px/1 var(--mono); padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ice); background: rgba(95, 212, 242, 0.06); }
.demo-bar { margin-top: 12px; padding: 9px 14px; border-radius: 8px; background: rgba(165, 140, 240, 0.12); border: 1px solid rgba(165, 140, 240, 0.4); font-size: 13px; }
.subtabs { display: flex; gap: 4px; margin-top: 14px; border-bottom: 1px solid var(--line); }
.subtabs a { padding: 9px 14px; color: var(--fg-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.subtabs a.on { color: var(--ice); border-bottom-color: var(--cyan); }
.subtabs a:hover { text-decoration: none; color: var(--fg); }
.page { padding-block: 20px 28px; min-width: 0; animation: enter 0.35s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.foot { border-top: 1px solid var(--line); color: var(--fg-3); font-size: 12px; padding-block: 14px 24px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-h-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; min-width: 0; }
.grid-2 > * { min-width: 0; }
.wide-left { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
@media (max-width: 900px) { .wide-left { grid-template-columns: 1fr; } }

/* panels */
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 12px 30px rgba(0,0,0,0.25); min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 16px 0; flex-wrap: wrap; }
.panel-b { padding: 12px 16px 16px; min-width: 0; }
.panel-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* buttons, inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: rgba(95, 212, 242, 0.08); color: var(--ice); font: 500 13px/1.2 var(--sans); cursor: pointer; transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s; }
.btn:hover:not(:disabled) { background: rgba(95, 212, 242, 0.16); box-shadow: 0 0 0 3px rgba(95, 212, 242, 0.08); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-sm { min-height: 32px; padding: 5px 10px; font-size: 12.5px; }
.btn-primary { background: linear-gradient(180deg, rgba(95,212,242,0.9), rgba(60,170,210,0.9)); color: #03121a; border-color: transparent; font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: linear-gradient(180deg, #8fe6fb, #5fd4f2); }
.btn-ghost { background: transparent; color: var(--fg-2); border-color: var(--line); }
.btn-danger { background: rgba(255,123,114,0.18); border-color: rgba(255,123,114,0.6); color: #ffd6d2; }
.input { width: 100%; min-height: 38px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); color: var(--fg); font: 14px var(--sans); }
.input:focus { border-color: var(--line-strong); outline: 2px solid var(--focus); outline-offset: 1px; }
.input-sm { min-height: 32px; width: auto; padding: 4px 8px; font-size: 13px; }
.input-bad { border-color: var(--red); }
textarea.input { resize: vertical; }
.numwrap { position: relative; display: flex; align-items: center; width: 100%; }
.numwrap .input { padding-right: 58px; }
.unit { position: absolute; right: 10px; font: 11.5px var(--mono); color: var(--fg-3); pointer-events: none; }
.seg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0; border: 1px solid var(--line-strong); border-radius: 9px; padding: 3px; background: var(--bg-2); }
.seg button { border: 0; background: transparent; color: var(--fg-2); padding: 6px 12px; border-radius: 6px; font: 500 13px var(--sans); cursor: pointer; }
.seg button.on, .seg button[aria-checked="true"] { background: rgba(95,212,242,0.18); color: var(--ice); }
.seg .hint { margin-left: 10px; }
.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-2); }
.inline .numwrap { width: 120px; }

/* forms */
.form { display: grid; grid-template-columns: 1fr; gap: 14px; }
.form-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.form-tight { gap: 10px; }
.field { min-width: 0; }
.field-l { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.field-l label { font-weight: 500; color: var(--fg); font-size: 13px; }
.field-err .input { border-color: var(--red); }
select.input { appearance: auto; }

/* provenance */
.prov { font: 500 10.5px/1 var(--mono); padding: 3px 6px; border-radius: 5px; letter-spacing: 0.02em; white-space: nowrap; }
.prov-user { background: rgba(191,233,250,0.12); color: var(--ice); }
.prov-model { background: rgba(165,140,240,0.16); color: #d6c9ff; }
.prov-calculated { background: rgba(63,211,154,0.14); color: #9ff0cf; }
.prov-external { background: rgba(95,212,242,0.14); color: var(--cyan); }
.prov-illustrative { background: rgba(242,183,82,0.15); color: #ffd98f; }
.prov-unknown { background: rgba(255,123,114,0.14); color: #ffc2bd; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px/1 var(--mono); padding: 5px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill-ok { color: var(--emerald); border-color: rgba(63,211,154,0.45); background: rgba(63,211,154,0.08); }
.pill-warn { color: var(--amber); border-color: rgba(242,183,82,0.5); background: rgba(242,183,82,0.08); }
.pill-bad { color: var(--red); border-color: rgba(255,123,114,0.55); background: rgba(255,123,114,0.08); }
.pill-idle { color: var(--fg-2); border-color: var(--line); background: transparent; }
.pill-info { color: var(--violet); border-color: rgba(165,140,240,0.5); background: rgba(165,140,240,0.08); }

/* hero, stages, metrics */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 22px; border-radius: 14px; border: 1px solid var(--line-strong); background: radial-gradient(700px 300px at 0% 0%, rgba(95,212,242,0.12), transparent 70%), linear-gradient(180deg, var(--panel-2), var(--panel)); }
.hero h1 { margin-bottom: 4px; }
.hero-side { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 200px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .hero-side { align-items: flex-start; } }
.ring { width: 118px; height: 118px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--emerald) calc(var(--p) * 1%), rgba(120,200,235,0.12) 0); position: relative; }
.ring::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--panel); }
.ring span { position: relative; font: 600 22px var(--display); color: var(--fg); }
.ring-l { font-size: 12px; color: var(--fg-2); }
.review-box { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-2); display: flex; flex-direction: column; gap: 6px; }
.review-t { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-3); }
.review-btn { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.row-wrap .btn { flex-shrink: 0; }
.hero .row-wrap { margin-top: 14px; }
.lede + .row-wrap { margin-top: 14px; }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.stage { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--fg); transition: border-color 0.2s, transform 0.2s; }
.stage:hover { border-color: var(--line-strong); transform: translateY(-1px); text-decoration: none; }
.stage-h { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.stage-l { font-weight: 600; }
.stage-d { color: var(--fg-2); font-size: 12.5px; margin: 0; min-height: 2.6em; }
.bar { height: 6px; border-radius: 99px; background: rgba(120,200,235,0.12); overflow: hidden; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--emerald)); border-radius: inherit; transition: width 0.5s ease; }
.stage-blocked .bar span { background: var(--red); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.metrics-sm { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 12px; }
.metric { padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, var(--panel-2), var(--panel)); min-width: 0; }
.metric-l { color: var(--fg-2); font-size: 12px; margin-bottom: 6px; }
.metric-v { font: 600 24px/1.1 var(--display); color: var(--ice); display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.metric-u { font: 12px var(--mono); color: var(--fg-3); }
.metric-f { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.metric-n { font-size: 11.5px; color: var(--fg-3); }

/* lists, tables, kv */
.list { margin: 0; padding-left: 18px; color: var(--fg-2); }
.list li { margin-bottom: 6px; }
.list-warn li { color: #ffd98f; }
.list a { color: var(--ice); }
.formulas { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.formulas code { font: 12px/1.5 var(--mono); color: var(--ice); background: var(--bg-2); padding: 6px 8px; border-radius: 6px; display: block; overflow-x: auto; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0 0 10px; font-size: 13px; }
.kv dt { color: var(--fg-3); }
.kv dd { margin: 0; color: var(--fg); min-width: 0; }
.tbl-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--line); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl thead th { color: var(--fg-2); font-weight: 600; background: var(--bg-2); font-size: 12px; }
.tbl caption { text-align: left; padding: 0 0 8px; color: var(--fg-2); }
.tbl tbody th { font-weight: 500; color: var(--fg-2); }
.tbl .num { text-align: right; }
.tbl-sm th, .tbl-sm td { padding: 6px 8px; }
.tbl tbody tr:hover { background: rgba(95,212,242,0.04); }
.recs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rec { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); }
.rec-k { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); padding-top: 2px; }
.rec-action { border-color: rgba(95,212,242,0.4); }
.rec-action .rec-k { color: var(--cyan); }
.rec-caution { border-color: rgba(242,183,82,0.35); }
.rec-caution .rec-k { color: var(--amber); }
.rec-insight .rec-k { color: var(--emerald); }
@media (max-width: 480px) { .rec { grid-template-columns: 1fr; } }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.quick a { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); color: var(--fg); transition: border-color 0.2s, background 0.2s; }
.quick a:hover { border-color: var(--line-strong); background: rgba(95,212,242,0.06); text-decoration: none; }
.quick span { color: var(--fg-3); font-size: 12px; }
.empty { padding: 16px; border: 1px dashed var(--line-strong); border-radius: var(--r); text-align: left; }
.empty-t { font-weight: 600; margin-bottom: 4px; }
.empty-b { color: var(--fg-2); }
.empty-a { margin-top: 10px; }
.ok-line { margin: 0 0 8px; }
.mini-list { margin: 0; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart .axis { fill: var(--fg-3); font: 11px var(--mono); }
.chart .val { fill: var(--fg); font: 600 11px var(--mono); }
.chart .grid-l { stroke: rgba(120,200,235,0.10); }
.chart .zero { stroke: var(--fg-3); stroke-width: 1; }
.chart .line { stroke: var(--emerald); stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 2000; stroke-dashoffset: 0; animation: draw 1s ease both; }
.chart .pb { stroke: var(--amber); stroke-dasharray: 4 4; }
@keyframes draw { from { stroke-dashoffset: 2000; } to { stroke-dashoffset: 0; } }

/* planner */
.planner { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .planner { grid-template-columns: 1fr; } }
.plan-card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.plan-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.plan { width: 100%; height: auto; display: block; touch-action: none; user-select: none; border-radius: 8px; background: var(--bg-2); }
.plan .roof { fill: rgba(191,233,250,0.05); stroke: var(--ice); stroke-width: 2; }
.plan .edge { fill: none; stroke: var(--fg-3); stroke-dasharray: 0.4 0.3; stroke-width: 1.2; }
.plan .pv { fill: rgba(95,212,242,0.18); stroke: var(--cyan); stroke-width: 1.5; cursor: grab; }
.plan .pv:focus, .plan .ex:focus { outline: none; }
.plan .pv.sel, .plan .ex.sel { stroke: var(--focus); stroke-width: 3; }
.plan .pv.bad { stroke: var(--red); }
.plan .ex { stroke: var(--red); stroke-width: 1.5; cursor: grab; }
.plan .mod { fill: rgba(63,211,154,0.35); stroke: rgba(63,211,154,0.8); stroke-width: 0.6; vector-effect: non-scaling-stroke; }
.plan .zl { fill: var(--cyan); font: 0.7px var(--mono); pointer-events: none; }
.plan .xl { fill: #ffb1aa; font: 0.7px var(--mono); pointer-events: none; }
.plan .dim { fill: var(--ice); font: 0.85px var(--mono); }
.plan .nbg { fill: rgba(5,8,15,0.7); stroke: var(--line-strong); stroke-width: 0.05; }
.plan .narrow { fill: var(--cyan); }
.plan .ntxt { fill: var(--ice); font: 0.6px var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--fg-2); margin: 10px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.k { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.k-roof { background: rgba(191,233,250,0.25); border: 1px solid var(--ice); }
.k-pv { background: rgba(95,212,242,0.35); border: 1px solid var(--cyan); }
.k-ex { background: repeating-linear-gradient(45deg, rgba(255,123,114,0.6) 0 2px, transparent 2px 5px); border: 1px solid var(--red); }
.k-mod { background: rgba(63,211,154,0.45); border: 1px solid var(--emerald); }
.k-edge { border: 1px dashed var(--fg-3); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
.dot-pv { background: var(--cyan); }
.dot-exclusion { background: var(--red); }
.zones { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.zone { padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); }
.zone.on { border-color: var(--line-strong); }
.zone-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.zone-h .link { color: var(--ice); }
.zone-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
.zone-grid .field-l label { font-size: 12px; color: var(--fg-2); }

/* studio */
.studio { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .studio { grid-template-columns: 1fr; } }
.studio-main { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.studio-main[data-fs] { border-radius: 0; border: 0; padding: 12px; height: 100vh; }
.studio-main[data-fs] .canvas-wrap { flex: 1; min-height: 0; }
.stage-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.canvas-wrap { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); min-height: 380px; background: radial-gradient(circle at 50% 35%, #15263f 0%, #060b15 75%); }
.gl { display: block; width: 100%; height: min(62vh, 620px); min-height: 380px; cursor: grab; outline: none; }
.gl:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.gl:active { cursor: grabbing; }
.studio-main[data-fs] .gl { height: 100%; min-height: 0; }
.canvas-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; color: var(--fg-2); background: rgba(5,8,15,0.55); pointer-events: none; }
.canvas-empty.bad { background: rgba(40,10,14,0.75); pointer-events: auto; }
.canvas-empty .empty-t { color: var(--fg); font-size: 16px; }
.canvas-empty p { max-width: 46ch; margin: 0; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(95,212,242,0.2); border-top-color: var(--cyan); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.section-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--fg-2); }
.section-row input[type="range"] { flex: 1; min-width: 160px; accent-color: var(--cyan); }
.studio-note { margin: 0; }
.studio-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.drop { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 16px; text-align: center; background: var(--bg-2); transition: border-color 0.2s, background 0.2s; }
.drop-on { border-color: var(--cyan); background: rgba(95,212,242,0.08); }
.drop p { margin-bottom: 10px; }
.drop .hint { margin-top: 10px; text-align: left; }
.cal { margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-2); }
.cal-t { font-weight: 600; margin-bottom: 8px; }
.units-status { margin: 12px 0; }
.surfaces { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 6px; }
.srf { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); color: var(--fg); cursor: pointer; font: inherit; }
.srf.on { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(95,212,242,0.12); }
.srf-l { font-weight: 500; }
.sel { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.layers { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; max-height: 220px; overflow: auto; }
.layers label { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.layers span { overflow-wrap: anywhere; }

/* report: always a bright print layout */
.report { --ink: #14202e; --ink-2: #44566b; --rule: #d6dee8; --accent: #0b6e8a; background: #ffffff; color: var(--ink); font-family: var(--sans); border-radius: 12px; padding: clamp(18px, 4vw, 36px); border: 1px solid var(--rule); min-width: 0; overflow-wrap: anywhere; }
.report, .report * { color-scheme: light; }
.report h1 { font: 600 26px/1.2 var(--display); color: var(--ink); }
.report h2 { font: 600 16px/1.3 var(--display); color: var(--accent); border-bottom: 1px solid var(--rule); padding-bottom: 6px; margin: 24px 0 10px; color: #0b5f78; }
.report p, .report li { color: var(--ink); }
.rpt-bar { background: #eef7fb; border: 1px solid #bcdcea; border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; font-size: 13px; color: #123a4b; }
.rpt-bar p { margin: 0 0 4px; }
.rpt-bar .link { color: #0b5f78; }
.rpt-status { color: #35566a; }
.rpt-h { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 3px solid #0b6e8a; }
.rpt-kicker { font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: #0b6e8a; margin-bottom: 6px; }
.rpt-h p { color: var(--ink-2); margin: 6px 0 0; max-width: 60ch; }
.rpt-meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12px; margin: 0; }
.rpt-meta dt { color: var(--ink-2); }
.rpt-meta dd { margin: 0; color: var(--ink); }
.rpt-t { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 10px; }
.rpt-t th, .rpt-t td { border: 1px solid var(--rule); padding: 6px 8px; text-align: left; vertical-align: top; color: var(--ink); }
.rpt-t th { background: #f4f8fb; color: var(--ink-2); font-weight: 600; width: 1%; white-space: nowrap; }
.rpt-t thead th { background: #e9f1f7; color: var(--ink); }
.rpt-num td, .rpt-num th { text-align: right; }
.rpt-num th:first-child { text-align: left; }
.rpt-prov td { font-size: 12px; }
.rpt-note { font-size: 12.5px; color: var(--ink-2); margin: 6px 0; }
.rpt-alert { background: #fff4e5; border: 1px solid #f0c27a; border-radius: 6px; padding: 8px 10px; color: #6b4300; }
.rpt-list { padding-left: 18px; font-size: 13px; color: var(--ink); }
.rpt-list li { margin-bottom: 4px; }
.mono-l li { font-family: var(--mono); font-size: 11.5px; }
.rpt-f { margin-top: 26px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-2); }
.report section { break-inside: auto; }
.report table { break-inside: auto; }
.report tr { break-inside: avoid; }

/* motion + small screens */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 560px) {
  .topbar { gap: 10px; }
  .topbar-r { display: none; }
  .nav a { padding: 6px 8px; font-size: 13px; }
  .brand-s { display: none; }
  .zone-grid { grid-template-columns: 1fr 1fr; }
  .gl { min-height: 300px; }
  .canvas-wrap { min-height: 300px; }
}
@media print {
  :root { color-scheme: light; }
  body { background: #fff !important; color: #000; padding: 0 !important; }
  .topbar, .foot, .demo-bar, .subtabs, .no-print { display: none !important; }
  .page { padding: 0 !important; animation: none; }
  .report { border: 0; padding: 0; }
  .rpt-h, .report h2 { break-after: avoid; }
}
